<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2B233">
<title>Kadai Shelf Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;600;800&display=swap">
<style>
/* Layout: one narrow column; sticky search bar on top, a big bin-label card for the best match, shelf strip, then other matches */
:root{
  --bg:#EEF1F2; --surface:#FFFFFF; --ink:#15222B; --muted:#56666F; --line:#CBD3D7;
  --tag:#F2B233; --tag-ink:#1B1608;
  --plumb:#2F6FA3; --elec:#B9461A; --hw:#4D5B63;
  --font:"Catamaran","Noto Sans Tamil","Latha",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --surface:#18232A; --ink:#E8EEF0; --muted:#97A7AF; --line:#2B3A42;
  --tag:#F2B233; --tag-ink:#1B1608; --plumb:#74AEDC; --elec:#F0895B; --hw:#A3B1B8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#18232A; --ink:#E8EEF0; --muted:#97A7AF; --line:#2B3A42;
  --tag:#F2B233; --tag-ink:#1B1608; --plumb:#74AEDC; --elec:#F0895B; --hw:#A3B1B8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:22px;font-weight:800;margin:0;text-wrap:balance}
h1 small{font-weight:600;color:var(--muted);font-size:15px;margin-left:6px}
.speak-toggle{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.speak-toggle[aria-pressed="false"]{color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:6px 8px 6px 14px}
.search:focus-within{outline:3px solid var(--tag);outline-offset:2px}
.search svg{flex:none;width:26px;height:26px;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:22px;font-weight:600;padding:8px 0}
#q:focus{outline:none}
#clear{flex:none;border:0;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;width:40px;height:40px;border-radius:10px;cursor:pointer}
.microw{display:flex;gap:10px;align-items:stretch}
.mic{flex:1;font:inherit;font-size:20px;font-weight:800;border:0;border-radius:14px;background:var(--tag);color:var(--tag-ink);padding:14px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.mic svg{width:28px;height:28px}
.mic.listening{background:var(--elec);color:#fff}
@media (prefers-reduced-motion:no-preference){.mic.listening{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.75}}}
.lang{flex:none;font:inherit;font-size:16px;font-weight:700;border:2px solid var(--ink);border-radius:14px;background:var(--surface);color:var(--ink);padding:0 14px;cursor:pointer}
.hint{font-size:15px;color:var(--muted);margin:0}
.hint b{color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--tag);outline-offset:2px}

/* Bin label */
.label{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.label-top{padding:16px 18px 12px;display:flex;flex-direction:column;gap:2px;border-left:8px solid var(--cat)}
.cat{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cat)}
.pname{font-size:26px;font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
.pta{font-size:19px;font-weight:600;color:var(--muted)}
.loc{display:grid;grid-template-columns:1fr 1fr 1.2fr;border-top:1px solid var(--line)}
.loc>div{padding:12px 14px;display:flex;flex-direction:column;gap:0;min-width:0}
.loc>div+div{border-left:1px solid var(--line)}
.loc .k{font-size:13px;font-weight:600;color:var(--muted);line-height:1.2}
.loc .v{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin-top:6px}
.loc .price{background:var(--tag);color:var(--tag-ink)}
.loc .price .k{color:var(--tag-ink);opacity:.75}
.loc .price .v{font-size:36px}
.loc .unit{font-size:13px;font-weight:600}
.label-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.say{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:10px;background:var(--ink);color:var(--bg);padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.say svg{width:18px;height:18px}

/* Shelf strip */
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:0 14px 14px}
.strip span{height:30px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.strip span.on{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.strip-cap{padding:0 14px 6px;font-size:13px;color:var(--muted)}

h2{font-size:15px;font-weight:700;color:var(--muted);margin:4px 0 0;letter-spacing:.04em;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.row{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--cat);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;cursor:pointer}
.row .n{font-weight:700;font-size:18px;min-width:0}
.row .t{color:var(--muted);font-size:15px;min-width:0}
.row .where{grid-row:1 / span 2;grid-column:2;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;line-height:1.3}
.row .where small{display:block;color:var(--muted);font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.empty b{color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0}
@media (max-width:380px){.loc .v{font-size:36px}.loc .price .v{font-size:30px}}
@media (prefers-reduced-motion:no-preference){.label{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.985)}to{transform:none}}}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="brand">
      <h1>பொருள் எங்கே? <small>Shelf Finder</small></h1>
      <button class="speak-toggle" id="speakToggle" aria-pressed="true">சத்தம்: ON</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="பொருள் பெயர் சொல்லுங்கள்…" aria-label="Product name">
      <button id="clear" aria-label="Clear">✕</button>
    </div>
    <div class="microw">
      <button class="mic" id="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="micText">அழுத்தி பேசுங்கள் · Speak</span></button>
      <button class="lang" id="lang" aria-label="Voice language">தமிழ்</button>
    </div>
    <p class="hint" id="hint">பெரிய பட்டனை அழுத்தி பொருள் பெயரைச் சொல்லுங்கள் — Tamil or English.</p>
    <div class="chips" id="chips">
      <button class="chip" data-cat="all" aria-pressed="true">எல்லாம் · All</button>
      <button class="chip" data-cat="plumbing" aria-pressed="false">பிளம்பிங் · Plumbing</button>
      <button class="chip" data-cat="electrical" aria-pressed="false">எலக்ட்ரிக்கல் · Electrical</button>
      <button class="chip" data-cat="hardware" aria-pressed="false">ஹார்டுவேர் · Hardware</button>
    </div>
  </header>

  <section id="best"></section>
  <h2 id="moreTitle">மற்றவை · Other matches</h2>
  <ul class="list" id="list"></ul>
  <p class="note">Sample products for now. Replace with your shop's real list, shelves and prices.</p>
</div>

<script>
const CATS={
  plumbing:{ta:"பிளம்பிங்",en:"Plumbing",color:"var(--plumb)"},
  electrical:{ta:"எலக்ட்ரிக்கல்",en:"Electrical",color:"var(--elec)"},
  hardware:{ta:"ஹார்டுவேர்",en:"Hardware",color:"var(--hw)"}
};
// SAMPLE DATA — replace with the shop's real list
const P=[
 {n:'PVC pipe ½" (10 ft)',ta:"பிவிசி பைப் அரை இஞ்ச்",a:["pvc pipe","pipe","half inch pipe","பைப்","குழாய்","பிவிசி","pvc"],c:"plumbing",s:1,b:1,p:180,u:"per length"},
 {n:'PVC elbow ½"',ta:"எல்போ அரை இஞ்ச்",a:["elbow","elbo","bend","எல்போ","வளைவு"],c:"plumbing",s:2,b:4,p:12,u:"each"},
 {n:'PVC tee ½"',ta:"டீ ஜாயிண்ட்",a:["tee","t joint","tee joint","டீ","டி"],c:"plumbing",s:2,b:5,p:14,u:"each"},
 {n:'Ball valve ½"',ta:"பால் வால்வு",a:["valve","ball valve","வால்வு","வால்வ்"],c:"plumbing",s:2,b:8,p:95,u:"each"},
 {n:"Bib tap (brass)",ta:"தண்ணீர் குழாய் டேப்",a:["tap","bib tap","water tap","nalli","டேப்","நல்லி","தண்ணி குழாய்","பித்தளை டேப்"],c:"plumbing",s:3,b:2,p:260,u:"each"},
 {n:"Teflon tape",ta:"டெப்லான் டேப்",a:["teflon","thread tape","white tape","டெப்லான்","டெஃப்லான்","வெள்ளை டேப்"],c:"plumbing",s:3,b:7,p:15,u:"roll"},
 {n:"Solvent cement 50 ml",ta:"சால்வெண்ட் பசை",a:["solvent","cement","pipe glue","glue","பசை","சால்வென்ட்","சொல்வென்ட்"],c:"plumbing",s:3,b:9,p:65,u:"tube"},
 {n:'Pipe clamp ½"',ta:"பைப் கிளாம்ப்",a:["clamp","clip","கிளாம்ப்","கிளிப்"],c:"plumbing",s:2,b:10,p:4,u:"each"},
 {n:"Shower head",ta:"ஷவர்",a:["shower","shower head","ஷவர்"],c:"plumbing",s:3,b:3,p:350,u:"each"},
 {n:'Connection pipe 18"',ta:"கனெக்ஷன் பைப்",a:["connection pipe","connection","flexible pipe","கனெக்ஷன்","கனக்ஷன்"],c:"plumbing",s:3,b:5,p:90,u:"each"},
 {n:"1-way switch 6A",ta:"சுவிட்ச்",a:["switch","one way switch","சுவிட்ச்","ஸ்விட்ச்","சுவிச்"],c:"electrical",s:5,b:1,p:28,u:"each"},
 {n:"3-pin socket 6A",ta:"சாக்கெட் / பிளக் பாயிண்ட்",a:["socket","plug","plug point","three pin","சாக்கெட்","பிளக்","பிளக் பாயிண்ட்"],c:"electrical",s:5,b:2,p:45,u:"each"},
 {n:"LED bulb 9W",ta:"எல்இடி பல்பு",a:["bulb","led bulb","led","light","பல்பு","பல்ப்","லைட்","எல்இடி"],c:"electrical",s:6,b:1,p:99,u:"each"},
 {n:"Copper wire 1.0 sq mm (90 m)",ta:"காப்பர் வயர்",a:["wire","copper wire","வயர்","ஒயர்","காப்பர்"],c:"electrical",s:7,b:1,p:1450,u:"coil"},
 {n:"Insulation tape",ta:"இன்சுலேஷன் டேப்",a:["insulation","black tape","electrical tape","கருப்பு டேப்","இன்சுலேஷன்"],c:"electrical",s:5,b:9,p:20,u:"roll"},
 {n:"MCB 16A",ta:"எம்சிபி",a:["mcb","breaker","எம்சிபி","எம் சி பி"],c:"electrical",s:6,b:6,p:210,u:"each"},
 {n:"LED tube light 20W",ta:"டியூப் லைட்",a:["tube light","tube","batten","டியூப்","டியூப் லைட்","ட்யூப்"],c:"electrical",s:6,b:3,p:240,u:"each"},
 {n:"Ceiling rose",ta:"சீலிங் ரோஸ்",a:["ceiling rose","rose","சீலிங் ரோஸ்","சீலிங்"],c:"electrical",s:5,b:6,p:35,u:"each"},
 {n:"Extension board (4 socket)",ta:"எக்ஸ்டென்ஷன் போர்டு",a:["extension","extension board","spike","spike buster","board","எக்ஸ்டென்ஷன்","போர்டு","ஸ்பைக்"],c:"electrical",s:6,b:8,p:320,u:"each"},
 {n:"Fuse wire",ta:"பியூஸ் வயர்",a:["fuse","fuse wire","பியூஸ்","ஃபியூஸ்"],c:"electrical",s:5,b:10,p:10,u:"roll"},
 {n:'Wood screws 1" (pack of 50)',ta:"ஸ்க்ரூ / திருகாணி",a:["screw","screws","ஸ்க்ரூ","திருகாணி","ஸ்குரு"],c:"hardware",s:8,b:2,p:40,u:"pack"},
 {n:"Rawl plug / gitti (pack)",ta:"ரவுல் பிளக் / கிட்டி",a:["rawl plug","wall plug","gitti","plug gitti","ரவுல் பிளக்","கிட்டி"],c:"hardware",s:8,b:3,p:20,u:"pack"},
 {n:'Nails 2" (1 kg)',ta:"ஆணி",a:["nail","nails","ஆணி"],c:"hardware",s:8,b:5,p:110,u:"kg"}
];
const SHELVES=8;

const norm=s=>(s||"").toLowerCase().normalize("NFC").replace(/[″"'.,()/\\\-–—_?!]/g," ").replace(/\s+/g," ").trim();
P.forEach(x=>{x.keys=[x.n,x.ta,...x.a].map(norm).filter(Boolean)});

function lev(a,b){a=[...a];b=[...b];const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
 let prev=Array.from({length:n+1},(_,i)=>i);
 for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1))}prev=cur}
 return prev[n]}
const sim=(a,b)=>1-lev(a,b)/Math.max([...a].length,[...b].length);

function score(q,p){
 let best=0;const qt=q.split(" ");
 for(const k of p.keys){
  let s=0;
  if(k===q)s=100;
  // q is the start of a word in k (typing in progress), or k is a whole word/phrase in q — not a fragment inside a word
  else if((" "+k).includes(" "+q)||(" "+q+" ").includes(" "+k+" ")){const r=Math.min(k.length,q.length)/Math.max(k.length,q.length);s=60+30*r}
  else{const kt=k.split(" ");let tot=0;for(const t of qt){let m=0;for(const u of kt)m=Math.max(m,sim(t,u));tot+=m}s=70*(tot/qt.length)}
  if(s>best)best=s;
 }
 return best;
}

const $=id=>document.getElementById(id);
let cat="all",speakOn=true,lastSpoken="",timer;
try{if(localStorage.getItem("speakOn")==="0")speakOn=false}catch(e){}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rupee=n=>"₹"+n.toLocaleString("en-IN");

function bestCard(p){
 const c=CATS[p.c];
 let strip="";for(let i=1;i<=SHELVES;i++)strip+=`<span class="${i===p.s?"on":""}">${i}</span>`;
 return `<article class="label" style="--cat:${c.color}">
  <div class="label-top"><span class="cat">${c.ta} · ${c.en}</span><h3 class="pname">${esc(p.n)}</h3><span class="pta">${esc(p.ta)}</span></div>
  <div class="loc">
   <div><span class="k">அலமாரி<br>Shelf</span><span class="v">${p.s}</span></div>
   <div><span class="k">பெட்டி<br>Box</span><span class="v">${p.b}</span></div>
   <div class="price"><span class="k">விலை<br>Price</span><span class="v">${rupee(p.p)}</span><span class="unit">${esc(p.u)}</span></div>
  </div>
  <p class="strip-cap">கடையில் அலமாரி ${p.s} · Shelf ${p.s} in the shop</p>
  <div class="strip" aria-hidden="true">${strip}</div>
  <div class="label-foot"><span class="note">Box ${p.b} on shelf ${p.s}</span>
   <button class="say" id="sayBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>சொல்லு · Speak</button></div>
 </article>`;
}

function render(speakIt){
 const q=norm($("q").value);
 let items=P.filter(p=>cat==="all"||p.c===cat).map(p=>({p,s:q?score(q,p):0}));
 if(q)items=items.filter(x=>x.s>=38).sort((a,b)=>b.s-a.s);
 const best=$("best"),list=$("list");
 if(q&&!items.length){
  best.innerHTML=`<div class="empty"><b>“${esc($("q").value)}” கிடைக்கவில்லை.</b><br>Not found. Try another name, or check the spelling the keyboard wrote.</div>`;
  list.innerHTML="";$("moreTitle").hidden=true;return;
 }
 if(!q){best.innerHTML="";$("moreTitle").hidden=false;$("moreTitle").textContent="எல்லா பொருட்களும் · All products";}
 else{best.innerHTML=bestCard(items[0].p);$("moreTitle").textContent="மற்றவை · Other matches";$("moreTitle").hidden=items.length<2;
  $("sayBtn").onclick=()=>speak(items[0].p,true);}
 const rest=q?items.slice(1,6):items;
 list.innerHTML=rest.map(({p})=>`<li><button class="row" data-i="${P.indexOf(p)}" style="--cat:${CATS[p.c].color}">
  <span class="n">${esc(p.n)}</span><span class="t">${esc(p.ta)}</span>
  <span class="where">S${p.s} · B${p.b}<small>${rupee(p.p)}</small></span></button></li>`).join("");
 if(speakIt&&q&&items[0].s>=60)speak(items[0].p,false);
}

function speak(p,force){
 if(!force&&(!speakOn||lastSpoken===p))return;
 lastSpoken=p;
 try{
  const ss=window.speechSynthesis;if(!ss)return;ss.cancel();
  const voices=ss.getVoices();const ta=voices.find(v=>/^ta/i.test(v.lang));
  const u=new SpeechSynthesisUtterance(ta
   ?`${p.ta}. அலமாரி ${p.s}. பெட்டி ${p.b}. விலை ${p.p} ரூபாய்.`
   :`${p.n}. Shelf ${p.s}, box ${p.b}. Price ${p.p} rupees.`);
  if(ta){u.voice=ta;u.lang=ta.lang}else{const en=voices.find(v=>/en.IN/i.test(v.lang));if(en)u.voice=en;u.lang="en-IN"}
  u.rate=.9;ss.speak(u);
 }catch(e){}
}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}

$("q").addEventListener("input",()=>{render(false);clearTimeout(timer);timer=setTimeout(()=>render(true),900)});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(timer);lastSpoken="";render(true);$("q").blur()}});
$("clear").onclick=()=>{$("q").value="";lastSpoken="";render(false);$("q").focus()};
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.cat;
 document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));render(false)});
$("list").addEventListener("click",e=>{const r=e.target.closest(".row");if(!r)return;const p=P[+r.dataset.i];
 $("q").value=p.n;render(false);speak(p,true);window.scrollTo({top:0,behavior:"smooth"})});
const tg=$("speakToggle");
function syncToggle(){tg.setAttribute("aria-pressed",speakOn);tg.textContent="சத்தம்: "+(speakOn?"ON":"OFF")}
tg.onclick=()=>{speakOn=!speakOn;try{localStorage.setItem("speakOn",speakOn?"1":"0")}catch(e){}syncToggle()};
syncToggle();

// ---- Voice: in-app mic (Chrome / Android). Falls back to the keyboard mic if blocked.
let lang="ta-IN",rec=null,listening=false;
try{if(localStorage.getItem("lang")==="en-IN")lang="en-IN"}catch(e){}
const langBtn=$("lang"),micBtn=$("mic"),micText=$("micText"),hint=$("hint");
const syncLang=()=>{langBtn.textContent=lang==="ta-IN"?"தமிழ்":"English"};
syncLang();
langBtn.onclick=()=>{lang=lang==="ta-IN"?"en-IN":"ta-IN";try{localStorage.setItem("lang",lang)}catch(e){}syncLang()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function fallback(msg){
 micBtn.classList.remove("listening");listening=false;micText.textContent="அழுத்தி பேசுங்கள் · Speak";
 hint.innerHTML=msg||"இந்த இடத்தில் மைக் வேலை செய்யாது. கீபோர்டில் உள்ள <b>மைக்</b> பட்டனை பயன்படுத்துங்கள். <br>Mic is blocked here — use the keyboard mic instead.";
 $("q").focus();
}
function bestOf(list){
 let top=null,topS=-1;
 for(const t of list){const q=norm(t);if(!q)continue;
  for(const p of P){const s=score(q,p);if(s>topS){topS=s;top=t}}}
 return top||list[0]||"";
}
micBtn.onclick=()=>{
 if(listening){try{rec&&rec.stop()}catch(e){}return}
 if(!SR){fallback();return}
 try{
  rec=new SR();rec.lang=lang;rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
  rec.onstart=()=>{listening=true;micBtn.classList.add("listening");micText.textContent="கேட்கிறேன்… · Listening";
   hint.textContent=lang==="ta-IN"?"இப்போது பொருள் பெயரைச் சொல்லுங்கள்.":"Say the product name now."};
  rec.onresult=e=>{
   const alts=[];for(let i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);
   $("q").value=bestOf(alts);lastSpoken="";render(true);
  };
  rec.onerror=e=>{
   if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture")fallback();
   else if(e.error==="no-speech")fallback("எதுவும் கேட்கவில்லை. மீண்டும் அழுத்தி பேசுங்கள். · Didn't hear anything, tap and try again.");
   else fallback("மீண்டும் முயற்சிக்கவும். · Try again. ("+e.error+")");
  };
  rec.onend=()=>{if(listening){listening=false;micBtn.classList.remove("listening");micText.textContent="அழுத்தி பேசுங்கள் · Speak";
   if(!/கீபோர்டில்|எதுவும்|மீண்டும்/.test(hint.textContent))hint.textContent="மீண்டும் தேட பட்டனை அழுத்துங்கள். · Tap to search again."}};
  rec.start();
 }catch(e){fallback()}
};

$("q").value="elbow";render(false);
</script>
